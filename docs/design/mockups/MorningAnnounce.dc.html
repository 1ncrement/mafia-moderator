<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Окно утра: что объявить столу</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #1A1304;outline-offset:2px}
a{color:#F2B33D}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 640px; height: 660px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; background: #0F1115; color: #EEF0F4; font-family: 'Golos Text', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<div role="dialog" aria-label="Объяви столу" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 16px; border: 1px solid #F2B33D; background: #171A20">

<div style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>
<span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.03em; text-transform: uppercase; color: #F2B33D">День 3</span>
<span style="font-size: 17px; font-weight: 500">Объяви столу</span>
</div>

<sc-if value="{{hasDeaths}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 12px; border: 1px solid #F2B33D; background: #2A2413">
<span style="font-size: 15px; color: #FFD27A">Стол покидают игроки</span>
<span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 60px; line-height: 1.05; color: #F2B33D">№3, №7 и №9</span>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<li style="display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; border-radius: 10px; background: #1E222A"><span style="min-width: 44px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px">№9</span><span style="font-size: 16px">прощается со столом — 30 секунд</span></li>
<li style="display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; border-radius: 10px; background: #1E222A"><span style="min-width: 44px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px">№2</span><span style="font-size: 16px">был в бронежилете — остаётся в игре</span></li>
<li style="display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; border-radius: 10px; background: #1E222A"><span style="min-width: 44px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px">№4</span><span style="font-size: 16px">сегодня молчит</span></li>
</ul>
</sc-if>

<sc-if value="{{quiet}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 24px 20px; border-radius: 12px; border: 1px solid #F2B33D; background: #2A2413">
<span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; color: #F2B33D">Город просыпается в полном составе</span>
<span style="font-size: 15px; color: #FFD27A">Этой ночью никто не покинул стол.</span>
</div>
</sc-if>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 68px; padding: 0 20px; border: 0; border-radius: 12px; background: #F2B33D; font-size: 21px; font-weight: 700; color: #1A1304; cursor: pointer">
Объявил
<span style="padding: 1px 7px; border-radius: 5px; border: 1px solid #1A1304; font-size: 12px; font-weight: 600; color: #1A1304">Enter</span>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"quietNight":{"editor":"boolean","default":false,"section":"Ночь"},"$preview":{"width":640,"height":660}}'>
class Component extends DCLogic {
renderVals() {
const quiet = this.props.quietNight ?? false;
return { quiet: quiet, hasDeaths: !quiet };
}
}
</script>
</body>
</html>
