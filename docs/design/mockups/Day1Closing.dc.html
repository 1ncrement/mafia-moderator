<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панель шага: конец первого круга, дополнительная минута</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #F2B33D;outline-offset:2px}
a{color:#F2B33D}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 480px; height: 860px; box-sizing: border-box; padding: 24px; background: #0F1115; color: #EEF0F4; font-family: 'Golos Text', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<section aria-label="Текущий шаг" style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px; border: 1px solid #2B303B; border-radius: 14px; background: #171A20">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="padding: 8px 14px; border-radius: 10px; background: #F2B33D; font-size: 15px; font-weight: 700; color: #1A1304">Круг речей</span>
<span style="font-size: 13px; color: #A3ABB8">День 1 · круг начал №5, выбран случайно</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span style="font-size: 20px; font-weight: 700">Доп. минута №5</span>
<span style="font-size: 13px; color: #A3ABB8">идёт · из 1:00</span>
</div>
<span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 120px; line-height: 1; color: #F2B33D">0:48</span>
<span aria-hidden="true" style="height: 6px; border-radius: 3px; background: linear-gradient(to right, #F2B33D 80%, #2B303B 80%)"></span>
</div>

<div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 10px; border: 1px solid #2B303B; background: #1E222A; font-size: 16px; font-weight: 600; cursor: pointer">Пауза<span style="padding: 1px 6px; border-radius: 5px; border: 1px solid #5A6270; font-size: 12px; color: #A3ABB8">Пробел</span></button>
<button type="button" style="height: 52px; border-radius: 10px; border: 1px solid #2B303B; background: #1E222A; font-size: 15px; cursor: pointer">+10 с</button>
<button type="button" style="height: 52px; border-radius: 10px; border: 1px solid #2B303B; background: #1E222A; font-size: 15px; cursor: pointer">Заново</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; border: 1px solid #F2B33D; background: #2A2413">
<span style="font-size: 15px; font-weight: 600; color: #FFD27A">Круг закрывают первые двое</span>
<span style="font-size: 14px; color: #FFD27A">Все высказались. №5 и №6 говорили первыми и получают ещё по минуте.</span>
</div>

<dl style="margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; font-size: 14px">
<dt style="color: #A3ABB8">Говорили</dt><dd style="margin: 0">5 · 6 · 7 · 8 · 9 · 10 · 1 · 2 · 3 · 4</dd>
<dt style="color: #A3ABB8">Доп. минута</dt><dd style="margin: 0"><strong>5</strong> · 6</dd>
</dl>

<button type="button" style="align-self: flex-start; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2B303B; background: transparent; font-size: 14px; color: #A3ABB8; cursor: pointer">Пропустить доп. минуту</button>

<button type="button" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 68px; padding: 0 20px; border: 0; border-radius: 12px; background: #F2B33D; font-size: 20px; font-weight: 700; color: #1A1304; cursor: pointer">
Доп. минута №6 · 60 с
<span style="padding: 1px 7px; border-radius: 5px; border: 1px solid #1A1304; font-size: 12px; font-weight: 600; color: #1A1304">Enter</span>
</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
