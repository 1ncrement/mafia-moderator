<button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 136px; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 2px dashed #5A6270; background: transparent; font-size: 18px; font-weight: 600; color: #EEF0F4; cursor: pointer">Никого</button>

<li>
<button type="button" style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 12px; border-radius: 10px; border: 1px dashed #2B303B; background: transparent; text-align: left; cursor: pointer">

<h2 style="margin: 0; font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; color: #A3ABB8">Журнал</h2>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const ROLES = { 1: ['шериф', 'red'], 3: ['мафия · глава', 'black'], 4: ['доктор', 'red'], 8: ['мафия', 'black'], 10: ['проститутка', 'black'] };
const OUT = { 9: 'застрелен · Ночь 1', 4: 'выгнан · День 2' };
const MARK = { 1: ['выбран', '#9DB0FF'], 3: ['ходит сейчас', '#EEF0F4'], 5: ['прошлая ночь · не шериф', '#A3ABB8'], 6: ['цель мафии', '#F2B33D'] };
const picked = 1;
const players = [];
for (let seat = 1; seat <= 11; seat++) {
const r = ROLES[seat] || ['мирный житель', 'red'];
const out = OUT[seat] || '';
const m = MARK[seat] || null;
const sel = seat === picked;
players.push({
num: String(seat),
aria: 'Выбрать игрока №' + seat,
panelAria: 'Панель игрока №' + seat,
ariaDisabled: out ? 'true' : 'false',
role: r[0],
roleColor: out ? '#A3ABB8' : '#EEF0F4',
dotBg: r[1] === 'black' ? '#0A0A0A' : '#E5484D',
dotRing: r[1] === 'black' ? '0 0 0 2px #EEF0F4' : 'none',
border: sel ? '#9DB0FF' : '#2B303B',
bg: sel ? '#1B2140' : (out ? '#171A20' : '#1E222A'),
numColor: sel ? '#9DB0FF' : (out ? '#7C8492' : '#EEF0F4'),
numDecor: out ? 'line-through' : 'none',
cursor: out ? 'not-allowed' : 'pointer',
hasStatus: out !== '',
status: out,
hasMark: m !== null,
mark: m ? m[0] : '',
markColor: m ? m[1] : '#A3ABB8'
});
}
return { players: players };
}
}
</script>
