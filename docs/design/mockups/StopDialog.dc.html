<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Окно остановки игры: выбор победившей стороны</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #F2B33D;outline-offset:2px}
a{color:#F2B33D}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 640px; height: 560px; box-sizing: border-box; padding: 24px; background: #0F1115; color: #EEF0F4; font-family: 'Golos Text', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<div role="dialog" aria-label="Остановить игру" style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 24px; border: 1px solid #5A6270; border-radius: 16px; background: #171A20">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">Остановить игру?</h2>
<span style="font-size: 15px; color: #A3ABB8">День 3 · в игре 8 из 11. Выбери, какая сторона победила.</span>
</div>

<div role="radiogroup" aria-label="Победившая сторона" style="display: flex; flex-direction: column; gap: 8px">
<button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 8px 16px; border-radius: 12px; border: 2px solid #EEF0F4; background: #1E222A; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 18px; height: 18px; border-radius: 50%; background: #0A0A0A; box-shadow: 0 0 0 2px #EEF0F4"></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 19px; font-weight: 700">Чёрные</span><span style="font-size: 14px; color: #A3ABB8">мафия и проститутка · в игре 3</span></span>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
</button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 8px 16px; border-radius: 12px; border: 1px solid #2B303B; background: transparent; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 20px; height: 20px; border-radius: 50%; background: #E5484D"></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 19px; font-weight: 700">Красные</span><span style="font-size: 14px; color: #A3ABB8">мирные жители, шериф, доктор · в игре 5</span></span>
</button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 8px 16px; border-radius: 12px; border: 1px dashed #2B303B; background: transparent; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #A3ABB8; box-sizing: border-box"></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 19px; font-weight: 700">Без победителя</span><span style="font-size: 14px; color: #A3ABB8">партия прервана</span></span>
</button>
</div>

<div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" style="flex: 1 1 200px; min-height: 60px; padding: 0 18px; border-radius: 12px; border: 1px solid #2B303B; background: #1E222A; font-size: 17px; font-weight: 600; cursor: pointer">Вернуться в игру</button>
<button type="button" style="flex: 1 1 260px; min-height: 60px; padding: 0 18px; border: 0; border-radius: 12px; background: #F2B33D; font-size: 17px; font-weight: 700; color: #1A1304; cursor: pointer">Завершить: победа чёрных</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
