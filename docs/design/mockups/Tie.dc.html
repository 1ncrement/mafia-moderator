<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панель шага: вторая ничья, решает ведущий</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #F2B33D;outline-offset:2px}
a{color:#F2B33D}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 480px; height: 900px; box-sizing: border-box; padding: 24px; background: #0F1115; color: #EEF0F4; font-family: 'Golos Text', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<section aria-label="Переголосование" style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 20px; border: 1px solid #2B303B; border-radius: 14px; background: #171A20">

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A3ABB8">Первое голосование · голосуют 10</span>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<div style="display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 10px; background: #1E222A"><span style="font-size: 13px; color: #A3ABB8">№7</span><span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px">0</span></div>
<div style="display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 10px; background: #1E222A"><span style="font-size: 13px; color: #A3ABB8">№3</span><span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px">2</span></div>
<div style="display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 10px; border: 1px solid #F2B33D; background: #2A2413"><span style="font-size: 13px; color: #F2B33D">№10</span><span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px; color: #F2B33D">3</span></div>
<div style="display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 10px; background: #1E222A"><span style="font-size: 13px; color: #A3ABB8">№11</span><span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px">2</span></div>
<div style="display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 10px; border: 1px solid #F2B33D; background: #2A2413"><span style="font-size: 13px; color: #F2B33D">№4</span><span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px; color: #F2B33D">3</span></div>
</div>
<span style="font-size: 14px">Ничья: №10 и №4. Оба говорили по 30 секунд.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A3ABB8">Переголосование · голосуют 8, без №10 и №4</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-label="Изменить голоса за №10" style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 64px; padding: 8px 16px; border-radius: 12px; border: 1px solid #2B303B; background: #1E222A; cursor: pointer"><span style="font-size: 18px; font-weight: 600">№10</span><span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 36px">4</span></button>
<button type="button" aria-label="Изменить голоса за №4" style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 64px; padding: 8px 16px; border-radius: 12px; border: 1px solid #2B303B; background: #1E222A; cursor: pointer"><span style="font-size: 18px; font-weight: 600">№4</span><span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 36px">4</span></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 12px; border: 1px solid #F2B33D; background: #2A2413">
<span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 52px; line-height: 1.05; color: #F2B33D">Снова ничья</span>
<span style="font-size: 15px; color: #FFD27A">Приложение исход не предлагает. Решаешь ты.</span>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 60px; padding: 0 20px; border-radius: 12px; border: 2px solid #EEF0F4; background: #1E222A; font-size: 19px; font-weight: 700; cursor: pointer">Выгнать одного…</button>
<button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 60px; padding: 0 20px; border-radius: 12px; border: 2px solid #EEF0F4; background: #1E222A; font-size: 19px; font-weight: 700; cursor: pointer">Выгнать обоих: №10 и №4</button>
<button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 60px; padding: 0 20px; border-radius: 12px; border: 2px solid #EEF0F4; background: #1E222A; font-size: 19px; font-weight: 700; cursor: pointer">Никто не выгнан → Ночь 2</button>
<button type="button" style="align-self: center; height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: #A3ABB8; cursor: pointer">Переголосовать ещё раз</button>
</div>
</section>
</div>
